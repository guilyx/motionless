name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install cairo, so preview rendering is covered too
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libcairo2-dev pkg-config
      - run: pip install -e '.[dev]' pycairo
      - run: pytest --cov=motionless --cov-report=term-missing

  shell:
    name: Installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck install.sh docs/capture_screenshot.sh docs/capture_demo.sh
      - name: Installer help runs without side effects
        run: bash install.sh --help

  smoke:
    name: End-to-end on Xvfb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Deliberately no actions/setup-python here. PyGObject comes from apt and
      # is built for the runner's *system* interpreter; a venv built on any
      # other Python cannot see /usr/lib/python3/dist-packages and `import gi`
      # fails. This is the same mismatch `motionless doctor` reports.
      - name: Install GTK 3 bindings and a virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 python3-venv xvfb
      - name: Install into a venv built on the system interpreter
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --quiet -e .
      - name: Verify the bindings really import
        # A separate step so this failure mode is unmistakable rather than
        # surfacing three steps later as "daemon exited early".
        run: |
          .venv/bin/python - <<'PY'
          import gi
          gi.require_version("Gtk", "3.0")
          from gi.repository import Gtk
          print(f"GTK {Gtk.get_major_version()}.{Gtk.get_minor_version()}")
          PY
      - name: Start the daemon against a virtual display and drive it
        env:
          XDG_SESSION_TYPE: x11
        run: |
          xvfb-run -a --server-args="-screen 0 1280x800x24" .venv/bin/python - <<'PY'
          import subprocess, sys, time
          from motionless import ipc

          daemon = subprocess.Popen([sys.executable, "-m", "motionless", "run",
                                     "--source", "demo", "--verbose"])
          try:
              for _ in range(100):
                  if ipc.is_running():
                      break
                  if daemon.poll() is not None:
                      raise SystemExit("daemon exited early")
                  time.sleep(0.1)
              else:
                  raise SystemExit("daemon never came up")

              status = ipc.request("status")
              print("status:", status)
              assert status["visible"] is True, status
              assert status["monitors"] >= 1, status

              time.sleep(2)
              status = ipc.request("status")
              assert status["samples"] > 0, "demo source produced no samples"

              assert ipc.request("toggle")["visible"] is False
              assert ipc.request("toggle")["visible"] is True
              ipc.request("reload")
              ipc.request("quit")
          finally:
              try:
                  daemon.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  daemon.kill()
                  raise SystemExit("daemon did not stop on request") from None
          assert daemon.returncode == 0, f"daemon exited {daemon.returncode}"
          print("smoke test passed")
          PY

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
