[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "motionless-overlay"
dynamic = ["version"]
description = "Vehicle motion cues for Linux — an Apple-style click-through overlay that eases motion sickness while using a screen in a moving vehicle."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Erwin Lejeune", email = "erwin.lejeune15@gmail.com" }]
keywords = [
  "motion-sickness",
  "overlay",
  "accessibility",
  "vehicle-motion-cues",
  "gtk",
  "linux",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Adaptive Technologies",
  "Topic :: Desktop Environment",
]
# Runtime rendering needs PyGObject + GTK3, which ship as distro packages
# (python3-gi, gir1.2-gtk-3.0). They are deliberately NOT declared here: pip
# cannot build PyGObject reliably and the distro build is the supported one.
# `motionless doctor` checks for them and tells you what to install.
dependencies = [
  # tomllib is stdlib from 3.11; this covers Ubuntu 22.04 (Python 3.10).
  'tomli>=2.0; python_version < "3.11"',
]

[project.optional-dependencies]
# Only needed if you want pip to build PyGObject itself instead of using the
# distro package. Requires libgirepository / gobject-introspection dev headers.
gui = ["PyGObject>=3.42", "pycairo>=1.20"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/guilyx/motionless"
Repository = "https://github.com/guilyx/motionless"
Issues = "https://github.com/guilyx/motionless/issues"
Changelog = "https://github.com/guilyx/motionless/blob/main/CHANGELOG.md"

[project.scripts]
motionless = "motionless.cli:main"

[tool.hatch.version]
path = "src/motionless/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/motionless"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/packaging", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PTH", "ARG"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.10"
files = ["src/motionless"]
strict = true
warn_unreachable = true
# PyGObject ships no usable stubs; the overlay modules are the only importers.
[[tool.mypy.overrides]]
module = ["gi.*", "cairo.*", "tomli"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["motionless.overlay.window"]
# Gtk.Window resolves to Any without typelib stubs, so subclassing it and
# calling into it cannot be checked.
disallow_untyped_calls = false
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["motionless"]
omit = ["*/overlay/window.py"]
